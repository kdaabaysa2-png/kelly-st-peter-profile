<!doctype html><html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- data-static-meta: for crawlers that do not run JS. main.tsx removes them on boot so each route owns one title + description.
         Keep this head in step with content/site.ts and the Home entry in src/app/routes.ts. -->
    <title data-static-meta>Khessa Daabay | St. Peter - Unit Manager</title>
    <meta data-static-meta name="description" content="Personal profile of Khessa Daabay, St. Peter - Unit Manager." />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/geist-var.woff2" as="font" type="font/woff2" crossorigin />
    <!-- The light theme is the default, so preload its St. Peter mark. -->
    <link rel="preload" href="/images/brand/mark-96.webp" as="image" fetchpriority="high" />
    <meta name="theme-color" content="#F0F8FF" />

    <meta property="og:type" content="website" />
    <!-- Link previews: absolute URLs on your domain. Re-render og-image.png with scripts/make-og-image.mjs. -->
    <meta property="og:site_name" content="Khessa Daabay - St. Peter" />
    <meta property="og:url" content="https://example.com/" />
    <meta property="og:title" content="Khessa Daabay | St. Peter - Unit Manager" />
    <meta property="og:description" content="Personal profile of Khessa Daabay, St. Peter - Unit Manager." />
    <meta property="og:image" content="https://example.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Khessa Daabay, St. Peter - Unit Manager" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://example.com/og-image.png" />

    <!-- Light by default; a saved dark pick is applied before first paint, so it never flashes dark first.
         Mirrors src/lib/theme.ts. The deploy CSP allows this script by hash: after any edit run npm run csp:check. -->
    <script>
      try {
        if (localStorage.getItem('pv2-theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark'
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0A0A0A')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
